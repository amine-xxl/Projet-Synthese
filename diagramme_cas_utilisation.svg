  <path d="M195 300 C300 260 360 250 370 250" class="link"/><path d="M195 320 C350 270 610 250 650 250" class="link"/><path d="M195 345 C310 360 340 365 370 365" class="link"/><path d="M195 365 C430 390 610 365 650 365" class="link"/><path d="M195 385 C500 330 900 310 915 310" class="link"/>
  <path d="M195 705 C300 590 335 545 360 540" class="link"/><path d="M195 720 C430 570 615 540 650 540" class="link"/><path d="M195 745 C400 680 460 655 485 655" class="link"/><path d="M195 680 C360 380 620 365 650 365" class="link"/>
  <path d="M1305 405 C1215 450 1190 495 1165 500" class="link"/><path d="M1305 430 C1215 550 1195 610 1165 615" class="link"/><path d="M1305 392 C1190 355 970 365 940 365" class="link"/>
  <path d="M1305 765 C1230 780 1210 785 1205 785" class="link"/><path d="M1305 775 C1190 790 960 785 930 785" class="link"/><path d="M1305 790 C1120 850 1100 870 1080 870" class="link"/><path d="M1305 805 C1030 870 815 870 780 870" class="link"/><path d="M1305 820 C970 830 675 790 645 785" class="link"/>

  <!-- Includes -->
  <path d="M505 500 C560 430 685 395 760 385" class="include" marker-end="url(#arrow)"/><text x="630" y="444" class="label">inclut auth</text>
  <path d="M795 498 C790 450 790 410 795 407" class="include" marker-end="url(#arrow)"/><text x="845" y="452" class="label">inclut auth</text>
  <path d="M1010 456 C960 410 875 380 835 373" class="include" marker-end="url(#arrow)"/><text x="955" y="400" class="label">inclut auth</text>

  <rect x="60" y="890" width="250" height="58" rx="8" class="legendBox"/>
  <text x="80" y="914" class="legend">Public</text><circle cx="150" cy="909" r="9" fill="#eef7ff" stroke="#1976a3"/>
  <text x="80" y="938" class="legend">Protégé par authentification</text><circle cx="275" cy="933" r="9" fill="#ecfff5" stroke="#168a52"/>
</svg>
