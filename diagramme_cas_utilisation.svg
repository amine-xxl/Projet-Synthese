<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Diagramme de cas d'utilisation - PFF Issal Fes</title>
  <desc id="desc">Cas d'utilisation principaux de la plateforme Issal Fes : visiteur, client, chauffeur et administrateur.</desc>
  <defs>
    <style>
      .bg{fill:#f7f9fb}.system{fill:#fff;stroke:#2c3e50;stroke-width:2.5}.actor{stroke:#263238;stroke-width:3;fill:none;stroke-linecap:round}.actorText{font:700 20px Arial,sans-serif;fill:#263238}.uc{fill:#eef7ff;stroke:#1976a3;stroke-width:2}.ucAdmin{fill:#fff3e8;stroke:#c96b00;stroke-width:2}.ucUser{fill:#ecfff5;stroke:#168a52;stroke-width:2}.ucDriver{fill:#f2edff;stroke:#6d4bc2;stroke-width:2}.ucText{font:600 17px Arial,sans-serif;fill:#15232e;text-anchor:middle}.small{font:14px Arial,sans-serif;fill:#53636f;text-anchor:middle}.title{font:800 32px Arial,sans-serif;fill:#17212b}.subtitle{font:16px Arial,sans-serif;fill:#52616d}.link{stroke:#455a64;stroke-width:2;fill:none}.include{stroke:#78909c;stroke-width:1.8;fill:none;stroke-dasharray:7 6}.label{font:13px Arial,sans-serif;fill:#607d8b;text-anchor:middle}.legendBox{fill:#ffffff;stroke:#d5dde5;stroke-width:1.5}.legend{font:15px Arial,sans-serif;fill:#33444f}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#78909c"/></marker>
  </defs>
  <rect class="bg" width="1500" height="980"/>
  <text x="60" y="60" class="title">Diagramme de cas d'utilisation - Issal Fes</text>
  <text x="60" y="88" class="subtitle">Application web de transport urbain : consultation des lignes, achat de billets, espace chauffeur et administration.</text>

  <rect x="290" y="125" width="920" height="790" rx="18" class="system"/>
  <text x="750" y="162" class="title" style="font-size:24px;text-anchor:middle">Système PFF / Issal Fes</text>

  <!-- Acteurs -->
  <g transform="translate(105 245)">
    <circle cx="45" cy="28" r="24" class="actor"/><path d="M45 52v78M5 84h80M45 130l-35 65M45 130l35 65" class="actor"/>
    <text x="45" y="226" class="actorText" text-anchor="middle">Visiteur</text>
  </g>
  <g transform="translate(105 610)">
    <circle cx="45" cy="28" r="24" class="actor"/><path d="M45 52v78M5 84h80M45 130l-35 65M45 130l35 65" class="actor"/>
    <text x="45" y="226" class="actorText" text-anchor="middle">Client</text>
  </g>
  <g transform="translate(1305 285)">
    <circle cx="45" cy="28" r="24" class="actor"/><path d="M45 52v78M5 84h80M45 130l-35 65M45 130l35 65" class="actor"/>
    <text x="45" y="226" class="actorText" text-anchor="middle">Chauffeur</text>
  </g>
  <g transform="translate(1305 650)">
    <circle cx="45" cy="28" r="24" class="actor"/><path d="M45 52v78M5 84h80M45 130l-35 65M45 130l35 65" class="actor"/>
    <text x="45" y="226" class="actorText" text-anchor="middle">Administrateur</text>
  </g>

  <!-- Cas publics -->
  <ellipse cx="515" cy="250" rx="145" ry="42" class="uc"/><text x="515" y="246" class="ucText">Consulter les lignes</text><text x="515" y="268" class="small">avec itinéraires</text>
  <ellipse cx="795" cy="250" rx="145" ry="42" class="uc"/><text x="795" y="246" class="ucText">Consulter actualités</text><text x="795" y="268" class="small">et alertes actives</text>
  <ellipse cx="515" cy="365" rx="145" ry="42" class="uc"/><text x="515" y="361" class="ucText">Créer un compte</text><text x="515" y="383" class="small">register</text>
  <ellipse cx="795" cy="365" rx="145" ry="42" class="uc"/><text x="795" y="361" class="ucText">Se connecter</text><text x="795" y="383" class="small">Sanctum token</text>
  <ellipse cx="1045" cy="310" rx="130" ry="42" class="uc"/><text x="1045" y="306" class="ucText">Envoyer message</text><text x="1045" y="328" class="small">contact</text>

  <!-- Cas client -->
  <ellipse cx="505" cy="540" rx="145" ry="42" class="ucUser"/><text x="505" y="536" class="ucText">Acheter un billet</text><text x="505" y="558" class="small">ligne + prix</text>
  <ellipse cx="795" cy="540" rx="145" ry="42" class="ucUser"/><text x="795" y="536" class="ucText">Voir mes billets</text><text x="795" y="558" class="small">historique</text>
  <ellipse cx="645" cy="655" rx="160" ry="42" class="ucUser"/><text x="645" y="651" class="ucText">Modifier profil</text><text x="645" y="673" class="small">infos et mot de passe</text>

  <!-- Chauffeur -->
  <ellipse cx="1010" cy="500" rx="155" ry="44" class="ucDriver"/><text x="1010" y="496" class="ucText">Consulter affectation</text><text x="1010" y="518" class="small">bus, ligne, trajet</text>
  <ellipse cx="1010" cy="615" rx="155" ry="44" class="ucDriver"/><text x="1010" y="611" class="ucText">Voir alertes ligne</text><text x="1010" y="633" class="small">alertes actives</text>

  <!-- Admin -->
  <ellipse cx="500" cy="785" rx="145" ry="42" class="ucAdmin"/><text x="500" y="781" class="ucText">Gérer lignes</text><text x="500" y="803" class="small">CRUD + arrêts</text>
  <ellipse cx="785" cy="785" rx="145" ry="42" class="ucAdmin"/><text x="785" y="781" class="ucText">Gérer actualités</text><text x="785" y="803" class="small">image + contenu</text>
  <ellipse cx="1060" cy="785" rx="145" ry="42" class="ucAdmin"/><text x="1060" y="781" class="ucText">Gérer alertes</text><text x="1060" y="803" class="small">retard, perturbation</text>
  <ellipse cx="625" cy="870" rx="155" ry="38" class="ucAdmin"/><text x="625" y="876" class="ucText">Lire/supprimer messages</text>
  <ellipse cx="925" cy="870" rx="155" ry="38" class="ucAdmin"/><text x="925" y="866" class="ucText">Affecter chauffeurs</text><text x="925" y="888" class="small">bus + ligne</text>

