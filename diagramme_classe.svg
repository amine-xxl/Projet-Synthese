<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1180" viewBox="0 0 1700 1180" role="img" aria-labelledby="title desc">
  <title id="title">Diagramme de classes - PFF Issal Fes</title>
  <desc id="desc">Classes Laravel principales : modèles, contrôleurs et relations métiers.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:800 34px Arial,sans-serif;fill:#17212b}.subtitle{font:16px Arial,sans-serif;fill:#52616d}.pkg{fill:#ffffff;stroke:#cfd8dc;stroke-width:2}.pkgTitle{font:700 18px Arial,sans-serif;fill:#344955}.class{fill:#fff;stroke:#2d4053;stroke-width:2}.head{fill:#e8f4fb;stroke:#2d4053;stroke-width:2}.ctrlHead{fill:#fff1df;stroke:#2d4053;stroke-width:2}.name{font:800 18px Arial,sans-serif;fill:#18242e;text-anchor:middle}.stereo{font:13px Arial,sans-serif;fill:#607d8b;text-anchor:middle}.attr{font:15px Consolas,monospace;fill:#263238}.method{font:14px Consolas,monospace;fill:#37474f}.rel{stroke:#37474f;stroke-width:2;fill:none}.dep{stroke:#607d8b;stroke-width:1.8;stroke-dasharray:8 6;fill:none}.card{fill:#ffffff;stroke:#d6dee6;stroke-width:1.5}.note{font:14px Arial,sans-serif;fill:#53636f}.mult{font:700 14px Arial,sans-serif;fill:#263238}.label{font:14px Arial,sans-serif;fill:#455a64;text-anchor:middle}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L10,4 z" fill="#607d8b"/></marker>
    <marker id="diamond" markerWidth="16" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,6 L8,1 L14,6 L8,11 z" fill="#fff" stroke="#37474f" stroke-width="1.5"/></marker>
  </defs>
  <rect class="bg" width="1700" height="1180"/>
  <text x="60" y="58" class="title">Diagramme de classes - Issal Fes</text>
  <text x="60" y="88" class="subtitle">Modèles Eloquent, contrôleurs REST et relations observées dans le projet Laravel.</text>

  <rect x="55" y="125" width="1135" height="950" rx="14" class="pkg"/>
  <text x="80" y="157" class="pkgTitle">Domaine métier / Modèles Eloquent</text>
  <rect x="1225" y="125" width="420" height="950" rx="14" class="pkg"/>
  <text x="1250" y="157" class="pkgTitle">Couche contrôleurs API</text>

  <!-- User -->
  <g id="User" transform="translate(115 205)">
    <rect width="310" height="250" rx="8" class="class"/><rect width="310" height="58" rx="8" class="head"/><text x="155" y="24" class="stereo">&lt;&lt;Model&gt;&gt;</text><text x="155" y="47" class="name">User</text>
    <text x="18" y="88" class="attr">+ id: bigint</text><text x="18" y="112" class="attr">+ name: string</text><text x="18" y="136" class="attr">+ email: string</text><text x="18" y="160" class="attr">+ password: hashed</text><text x="18" y="184" class="attr">+ role: client|chauffeur|admin</text><text x="18" y="208" class="attr">+ active: boolean</text>
    <line x1="0" y1="222" x2="310" y2="222" stroke="#d2dbe3"/><text x="18" y="242" class="method">+ tickets()</text>
  </g>

  <!-- Ligne -->
  <g id="Ligne" transform="translate(515 205)">
    <rect width="320" height="274" rx="8" class="class"/><rect width="320" height="58" rx="8" class="head"/><text x="160" y="24" class="stereo">&lt;&lt;Model&gt;&gt;</text><text x="160" y="47" class="name">Ligne</text>
    <text x="18" y="88" class="attr">+ id: bigint</text><text x="18" y="112" class="attr">+ numero: string</text><text x="18" y="136" class="attr">+ depart: string</text><text x="18" y="160" class="attr">+ arrivee: string</text><text x="18" y="184" class="attr">+ prix: decimal</text><text x="18" y="208" class="attr">+ description: text</text>
    <line x1="0" y1="222" x2="320" y2="222" stroke="#d2dbe3"/><text x="18" y="244" class="method">+ itineraires()</text><text x="170" y="244" class="method">+ alertes()</text><text x="18" y="266" class="method">+ tickets()</text><text x="170" y="266" class="method">+ proInfos()</text>
  </g>

  <!-- Ticket -->
  <g id="Ticket" transform="translate(115 560)">
    <rect width="310" height="225" rx="8" class="class"/><rect width="310" height="58" rx="8" class="head"/><text x="155" y="24" class="stereo">&lt;&lt;Model&gt;&gt;</text><text x="155" y="47" class="name">Ticket</text>
    <text x="18" y="88" class="attr">+ id: bigint</text><text x="18" y="112" class="attr">+ user_id: FK</text><text x="18" y="136" class="attr">+ ligne_id: FK</text><text x="18" y="160" class="attr">+ prix: decimal</text><text x="18" y="184" class="attr">+ statut: actif|utilise|annule</text><text x="18" y="208" class="attr">+ date_achat: timestamp</text>
  </g>

  <!-- Itineraire -->
  <g id="Itineraire" transform="translate(515 570)">
    <rect width="320" height="205" rx="8" class="class"/><rect width="320" height="58" rx="8" class="head"/><text x="160" y="24" class="stereo">&lt;&lt;Model&gt;&gt;</text><text x="160" y="47" class="name">Itineraire</text>
    <text x="18" y="88" class="attr">+ id: bigint</text><text x="18" y="112" class="attr">+ ligne_id: FK</text><text x="18" y="136" class="attr">+ direction: aller|retour</text><text x="18" y="160" class="attr">+ nom_arret: string</text><text x="18" y="184" class="attr">+ ordre: integer</text>
  </g>

  <!-- Alerte -->
  <g id="Alerte" transform="translate(895 205)">
    <rect width="255" height="205" rx="8" class="class"/><rect width="255" height="58" rx="8" class="head"/><text x="128" y="24" class="stereo">&lt;&lt;Model&gt;&gt;</text><text x="128" y="47" class="name">Alerte</text>
    <text x="18" y="88" class="attr">+ id: bigint</text><text x="18" y="112" class="attr">+ ligne_id: FK</text><text x="18" y="136" class="attr">+ type: enum</text><text x="18" y="160" class="attr">+ message: text</text><text x="18" y="184" class="attr">+ statut: active|resolue</text>
  </g>

  <!-- ProInfo -->
  <g id="ProInfo" transform="translate(895 505)">
    <rect width="255" height="255" rx="8" class="class"/><rect width="255" height="58" rx="8" class="head"/><text x="128" y="24" class="stereo">&lt;&lt;Model&gt;&gt;</text><text x="128" y="47" class="name">ProInfo</text>
    <text x="18" y="88" class="attr">+ id: bigint</text><text x="18" y="112" class="attr">+ user_id: FK</text><text x="18" y="136" class="attr">+ ligne_id: FK</text><text x="18" y="160" class="attr">+ numero_bus: string</text><text x="18" y="184" class="attr">+ modele: string</text><text x="18" y="208" class="attr">+ capacite: integer</text><text x="18" y="232" class="attr">+ trajet: text</text><text x="18" y="252" class="attr">+ tarif: decimal</text>
  </g>

  <!-- Actualite + Message -->
  <g transform="translate(115 860)">
    <rect width="310" height="160" rx="8" class="class"/><rect width="310" height="58" rx="8" class="head"/><text x="155" y="24" class="stereo">&lt;&lt;Model&gt;&gt;</text><text x="155" y="47" class="name">Actualite</text>
    <text x="18" y="88" class="attr">+ id: bigint</text><text x="18" y="112" class="attr">+ titre: string</text><text x="18" y="136" class="attr">+ contenu: text</text><text x="18" y="156" class="attr">+ image: nullable string</text>
  </g>
  <g transform="translate(515 860)">
    <rect width="320" height="180" rx="8" class="class"/><rect width="320" height="58" rx="8" class="head"/><text x="160" y="24" class="stereo">&lt;&lt;Model&gt;&gt;</text><text x="160" y="47" class="name">Message</text>
    <text x="18" y="88" class="attr">+ id: bigint</text><text x="18" y="112" class="attr">+ name: string</text><text x="18" y="136" class="attr">+ email: string</text><text x="18" y="160" class="attr">+ subject, message, subscribe</text>
  </g>

  <!-- Relations -->
  <path d="M270 455 L270 560" class="rel" marker-start="url(#diamond)"/><text x="245" y="486" class="mult">1</text><text x="285" y="548" class="mult">0..*</text><text x="345" y="515" class="label">achète</text>
  <path d="M425 675 L515 675" class="rel"/><text x="438" y="665" class="mult">0..*</text><text x="493" y="665" class="mult">1</text>
  <path d="M675 479 L675 570" class="rel" marker-start="url(#diamond)"/><text x="650" y="505" class="mult">1</text><text x="690" y="560" class="mult">0..*</text><text x="745" y="530" class="label">contient</text>
  <path d="M835 300 L895 300" class="rel"/><text x="845" y="289" class="mult">1</text><text x="870" y="289" class="mult">0..*</text>
  <path d="M835 640 L895 640" class="rel"/><text x="845" y="630" class="mult">1</text><text x="870" y="630" class="mult">0..*</text>
  <path d="M425 330 C590 495 740 545 895 610" class="rel"/><text x="438" y="352" class="mult">1</text><text x="872" y="596" class="mult">0..1</text><text x="650" y="505" class="label">chauffeur</text>

  <!-- Controllers -->
  <g transform="translate(1260 205)">
    <rect width="350" height="720" rx="8" class="class"/><rect width="350" height="58" rx="8" class="ctrlHead"/><text x="175" y="24" class="stereo">&lt;&lt;Controllers&gt;&gt;</text><text x="175" y="47" class="name">API Laravel</text>
    <text x="22" y="92" class="method">AuthController</text><text x="42" y="116" class="method">+ register(), login()</text>
    <text x="22" y="160" class="method">LigneController</text><text x="42" y="184" class="method">+ index(), store(), show()</text><text x="42" y="206" class="method">+ update(), destroy()</text>
    <text x="22" y="250" class="method">TicketController</text><text x="42" y="274" class="method">+ index(), store()</text>
    <text x="22" y="318" class="method">ActualiteController</text><text x="42" y="342" class="method">+ index(), store(), update()</text><text x="42" y="364" class="method">+ show(), destroy()</text>
    <text x="22" y="408" class="method">AlerteController</text><text x="42" y="432" class="method">+ index(), CRUD admin</text>
    <text x="22" y="476" class="method">ProInfoController</text><text x="42" y="500" class="method">+ getDriverInfo()</text><text x="42" y="522" class="method">+ affecter chauffeur</text>
    <text x="22" y="566" class="method">MessageController</text><text x="42" y="590" class="method">+ store(), index(), destroy()</text>
    <text x="22" y="634" class="method">UserController</text><text x="42" y="658" class="method">+ update(), updatePassword()</text>
  </g>
  <path d="M1260 290 C1090 240 990 230 835 250" class="dep" marker-end="url(#arrow)"/><text x="1100" y="244" class="label">utilise modèles</text>
  <path d="M1260 460 C1040 580 925 615 835 665" class="dep" marker-end="url(#arrow)"/>
  <path d="M1260 710 C1000 850 825 905 835 950" class="dep" marker-end="url(#arrow)"/>

  <rect x="895" y="860" width="255" height="130" rx="8" class="card"/>
  <text x="915" y="892" class="note">Notes</text>
  <text x="915" y="920" class="note">• Auth via Laravel Sanctum</text>
  <text x="915" y="946" class="note">• AdminMiddleware protège le CRUD</text>
  <text x="915" y="972" class="note">• Les suppressions FK sont en cascade</text>
</svg>
