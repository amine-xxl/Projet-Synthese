<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Diagramme de séquence - Achat de billet Issal Fes</title>
  <desc id="desc">Séquence principale : un client authentifié consulte les lignes puis achète un billet.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:800 34px Arial,sans-serif;fill:#17212b}.subtitle{font:16px Arial,sans-serif;fill:#52616d}.participant{fill:#ffffff;stroke:#2d4053;stroke-width:2}.pHead{fill:#e8f4fb;stroke:#2d4053;stroke-width:2}.pText{font:800 17px Arial,sans-serif;fill:#17212b;text-anchor:middle}.life{stroke:#90a4ae;stroke-width:2;stroke-dasharray:8 7}.activation{fill:#d9edf8;stroke:#1976a3;stroke-width:2}.msg{stroke:#263238;stroke-width:2;fill:none;marker-end:url(#arrow)}.return{stroke:#607d8b;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow2)}.label{font:15px Arial,sans-serif;fill:#263238}.small{font:13px Arial,sans-serif;fill:#607d8b}.frame{fill:#fffdf6;stroke:#d9b45f;stroke-width:2}.frameTitle{font:700 16px Arial,sans-serif;fill:#795548}.note{fill:#ffffff;stroke:#d6dee6;stroke-width:1.5}.noteText{font:14px Arial,sans-serif;fill:#455a64}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L10,4 z" fill="#263238"/></marker>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L10,4 z" fill="#607d8b"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1040"/>
  <text x="60" y="58" class="title">Diagramme de séquence - Achat de billet</text>
  <text x="60" y="88" class="subtitle">Flux principal basé sur React, les routes API Laravel Sanctum, TicketController, Ligne et Ticket.</text>

  <!-- Participants -->
  <g transform="translate(70 125)"><rect width="190" height="70" rx="8" class="participant"/><rect width="190" height="34" rx="8" class="pHead"/><text x="95" y="24" class="pText">Client</text><text x="95" y="55" class="small" text-anchor="middle">utilisateur connecté</text></g>
  <g transform="translate(330 125)"><rect width="210" height="70" rx="8" class="participant"/><rect width="210" height="34" rx="8" class="pHead"/><text x="105" y="24" class="pText">FrontEnd React</text><text x="105" y="55" class="small" text-anchor="middle">AchatTicket.jsx</text></g>
  <g transform="translate(620 125)"><rect width="210" height="70" rx="8" class="participant"/><rect width="210" height="34" rx="8" class="pHead"/><text x="105" y="24" class="pText">API Routes</text><text x="105" y="55" class="small" text-anchor="middle">auth:sanctum</text></g>
  <g transform="translate(910 125)"><rect width="230" height="70" rx="8" class="participant"/><rect width="230" height="34" rx="8" class="pHead"/><text x="115" y="24" class="pText">TicketController</text><text x="115" y="55" class="small" text-anchor="middle">store / index</text></g>
  <g transform="translate(1210 125)"><rect width="150" height="70" rx="8" class="participant"/><rect width="150" height="34" rx="8" class="pHead"/><text x="75" y="24" class="pText">Ligne</text><text x="75" y="55" class="small" text-anchor="middle">Model</text></g>
  <g transform="translate(1420 125)"><rect width="140" height="70" rx="8" class="participant"/><rect width="140" height="34" rx="8" class="pHead"/><text x="70" y="24" class="pText">Ticket</text><text x="70" y="55" class="small" text-anchor="middle">Model</text></g>

  <!-- Lifelines -->
  <line x1="165" y1="195" x2="165" y2="980" class="life"/><line x1="435" y1="195" x2="435" y2="980" class="life"/><line x1="725" y1="195" x2="725" y2="980" class="life"/><line x1="1025" y1="195" x2="1025" y2="980" class="life"/><line x1="1285" y1="195" x2="1285" y2="980" class="life"/><line x1="1490" y1="195" x2="1490" y2="980" class="life"/>

  <!-- Activations -->
  <rect x="425" y="235" width="20" height="690" rx="4" class="activation"/><rect x="715" y="285" width="20" height="560" rx="4" class="activation"/><rect x="1015" y="500" width="20" height="280" rx="4" class="activation"/><rect x="1275" y="575" width="20" height="80" rx="4" class="activation"/><rect x="1480" y="675" width="20" height="70" rx="4" class="activation"/>

  <!-- Flow -->
  <path d="M165 245 L425 245" class="msg"/><text x="185" y="236" class="label">1. Ouvre la page achat ticket</text>
  <path d="M435 300 L715 300" class="msg"/><text x="458" y="291" class="label">2. GET /api/lignes</text>
  <path d="M725 345 L435 345" class="return"/><text x="470" y="336" class="label">3. Liste des lignes + itinéraires</text>
  <path d="M435 390 L165 390" class="return"/><text x="205" y="381" class="label">4. Affiche lignes et prix</text>
  <path d="M165 465 L425 465" class="msg"/><text x="188" y="456" class="label">5. Choisit une ligne et confirme</text>

  <rect x="350" y="488" width="845" height="345" rx="10" class="frame"/>
  <text x="372" y="514" class="frameTitle">alt Client authentifié</text>
  <path d="M435 540 L715 540" class="msg"/><text x="458" y="531" class="label">6. POST /api/billets { ligne_id }</text>
  <text x="458" y="556" class="small">Authorization: Bearer token Sanctum</text>
  <path d="M725 585 L1015 585" class="msg"/><text x="747" y="576" class="label">7. Route protégée vers TicketController@store</text>
  <path d="M1025 630 L1275 630" class="msg"/><text x="1045" y="621" class="label">8. findOrFail(ligne_id)</text>
  <path d="M1285 660 L1025 660" class="return"/><text x="1085" y="651" class="label">9. Ligne + prix actuel</text>
  <path d="M1025 710 L1480 710" class="msg"/><text x="1045" y="701" class="label">10. Ticket::create(user_id, ligne_id, prix, statut actif)</text>
  <path d="M1490 760 L1025 760" class="return"/><text x="1128" y="751" class="label">11. Ticket créé</text>
  <path d="M1025 805 L725 805" class="return"/><text x="770" y="796" class="label">12. JSON ticket avec ligne, HTTP 201</text>

  <path d="M725 865 L435 865" class="return"/><text x="468" y="856" class="label">13. Réponse API</text>
  <path d="M435 915 L165 915" class="return"/><text x="210" y="906" class="label">14. Confirmation + billet affiché</text>

  <rect x="1185" y="835" width="330" height="95" rx="8" class="note"/>
  <text x="1205" y="865" class="noteText">Cas d'erreur possibles :</text>
  <text x="1205" y="892" class="noteText">• token absent ou invalide : 401</text>
  <text x="1205" y="918" class="noteText">• ligne_id inexistant : validation 422</text>
</svg>
